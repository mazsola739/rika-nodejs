<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My home tasks from the EPAM Node.js Global Mentoring Program (2023), renovated in 2026: a REPL, a process monitor, an EventEmitter, streams, tests, a node:http API, an Express API and SQLite. Most of the code runs right on the page."
    />
    <title>Node.js home tasks – Rika</title>
    <script>
      // Pick the theme before the first paint, so the page never flashes the wrong colors:
      // the visitor's saved choice, else the system setting. The key is this site's own: every
      // project page on mazsola739.github.io shares one localStorage.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('rika-nodejs:theme')
        } catch {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
